<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09111d" />
  <title>Snake — Rắn săn mồi</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09111d;
      --panel: rgba(17, 29, 47, .9);
      --muted: #94a3b8;
      --green: #7cf29a;
      --green-dark: #22c55e;
      --border: rgba(148, 163, 184, .17);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px 14px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e5edf7;
      background:
        radial-gradient(circle at 15% 15%, rgba(34, 197, 94, .11), transparent 32%),
        radial-gradient(circle at 85% 80%, rgba(59, 130, 246, .10), transparent 35%),
        var(--bg);
    }

    .game-shell { width: min(100%, 560px); }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--green);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(1.65rem, 5vw, 2.25rem); letter-spacing: -.04em; }
    .subtitle { margin: 6px 0 0; color: var(--muted); font-size: .9rem; }

    .score-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .score-card {
      padding: 13px 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 8px 30px rgba(0, 0, 0, .12);
    }

    .score-label { color: var(--muted); font-size: .76rem; text-transform: uppercase; letter-spacing: .1em; }
    .score-value { margin-top: 4px; font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }

    .board-wrap {
      position: relative;
      overflow: hidden;
      padding: 10px;
      border: 1px solid rgba(124, 242, 154, .2);
      border-radius: 22px;
      background: rgba(12, 22, 36, .95);
      box-shadow: 0 22px 65px rgba(0, 0, 0, .32), 0 0 35px rgba(34, 197, 94, .06);
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 13px;
      background: #0b1625;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 10px;
      display: grid;
      place-items: center;
      padding: 24px;
      border-radius: 13px;
      background: rgba(5, 12, 22, .77);
      text-align: center;
      backdrop-filter: blur(5px);
    }

    .overlay[hidden] { display: none; }
    .overlay-card { max-width: 300px; }
    .overlay-icon { font-size: 2.6rem; margin-bottom: 8px; }
    .overlay h2 { margin: 0 0 9px; font-size: 1.65rem; }
    .overlay p { margin: 0 0 18px; color: #b5c3d6; line-height: 1.55; }

    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      color: #06200e;
      background: var(--green);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      transition: transform .15s ease, filter .15s ease, background .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover { filter: brightness(1.06); transform: translateY(-1px); }
    button:active { transform: translateY(1px) scale(.98); }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }
    .controls-left { display: flex; gap: 9px; }
    .secondary {
      color: #d9e4f2;
      border: 1px solid var(--border);
      background: rgba(17, 29, 47, .85);
    }
    .hint { margin: 14px 2px 0; color: var(--muted); font-size: .82rem; line-height: 1.6; }
    kbd {
      display: inline-block;
      min-width: 24px;
      padding: 2px 6px;
      margin: 0 1px;
      border: 1px solid rgba(148, 163, 184, .25);
      border-radius: 5px;
      background: rgba(148, 163, 184, .08);
      color: #dbe7f5;
      font-family: inherit;
      font-size: .75rem;
      text-align: center;
    }

    .touch-controls {
      display: none;
      grid-template-columns: repeat(3, 54px);
      grid-template-rows: repeat(2, 48px);
      justify-content: center;
      gap: 7px;
      margin-top: 17px;
      user-select: none;
    }
    .touch-controls button { padding: 0; color: #e5edf7; background: #17263b; border: 1px solid var(--border); font-size: 1.25rem; }
    .touch-controls .up { grid-column: 2; grid-row: 1; }
    .touch-controls .left { grid-column: 1; grid-row: 2; }
    .touch-controls .down { grid-column: 2; grid-row: 2; }
    .touch-controls .right { grid-column: 3; grid-row: 2; }

    @media (max-width: 600px) {
      body {
        padding: max(12px, env(safe-area-inset-top))
                 max(10px, env(safe-area-inset-right))
                 max(16px, env(safe-area-inset-bottom))
                 max(10px, env(safe-area-inset-left));
      }
      .game-shell { width: min(100%, 480px); }
      header { margin-bottom: 12px; }
      h1 { font-size: clamp(1.5rem, 7vw, 2rem); }
      .subtitle { font-size: .82rem; }
      .score-row { gap: 8px; margin-bottom: 10px; }
      .score-card { padding: 10px 12px; border-radius: 12px; }
      .score-value { font-size: 1.35rem; }
      .board-wrap { padding: 6px; border-radius: 16px; }
      canvas { border-radius: 10px; touch-action: none; }
      .overlay { inset: 6px; padding: 16px; }
      .controls-row { flex-direction: column; align-items: stretch; gap: 8px; margin-top: 10px; }
      .controls-left { display: flex; width: 100%; gap: 8px; }
      .controls-left button, .controls-row > button { flex: 1; min-height: 46px; padding: 10px; }
      .touch-controls {
        display: grid;
        grid-template-columns: repeat(3, min(19vw, 64px));
        grid-template-rows: repeat(2, min(15vw, 58px));
        gap: 8px;
        margin-top: 12px;
        touch-action: manipulation;
      }
      .touch-controls button {
        min-height: 44px;
        border-radius: 14px;
        font-size: 1.3rem;
      }
      .hint { margin-top: 10px; text-align: center; font-size: .78rem; }
    }

    @media (max-width: 600px) and (max-height: 740px) {
      body { padding-top: max(6px, env(safe-area-inset-top)); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
      header { margin-bottom: 8px; }
      .subtitle { margin-top: 3px; }
      .score-card { padding: 8px 10px; }
      .touch-controls { margin-top: 8px; gap: 6px; }
      .hint { margin-top: 7px; }
    }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <main class="game-shell">
    <header>
      <div>
        <p class="eyebrow">Arcade · Classic</p>
        <h1>Snake <span aria-hidden="true">🐍</span></h1>
        <p class="subtitle">Ăn mồi, dài ra và đừng tự cắn mình!</p>
      </div>
    </header>

    <section class="score-row" aria-label="Điểm số">
      <div class="score-card">
        <div class="score-label">Điểm hiện tại</div>
        <div class="score-value" id="score">0</div>
      </div>
      <div class="score-card">
        <div class="score-label">Kỷ lục</div>
        <div class="score-value" id="best">0</div>
      </div>
    </section>

    <section class="board-wrap" aria-label="Bàn chơi rắn săn mồi">
      <canvas id="game" width="480" height="480" aria-label="Bàn chơi Snake"></canvas>
      <div class="overlay" id="overlay" hidden>
        <div class="overlay-card">
          <div class="overlay-icon" id="overlayIcon">🐍</div>
          <h2 id="overlayTitle">Tạm dừng</h2>
          <p id="overlayText">Nhấn tiếp tục để chơi tiếp nhé.</p>
          <button id="overlayButton" type="button">Tiếp tục</button>
        </div>
      </div>
    </section>

    <div class="controls-row">
      <div class="controls-left">
        <button class="secondary" id="pauseBtn" type="button">Ⅱ Tạm dừng</button>
        <button class="secondary" id="restartBtn" type="button">↻ Chơi lại</button>
      </div>
      <button id="startBtn" type="button">Bắt đầu mới</button>
    </div>

    <div class="touch-controls" aria-label="Điều khiển cảm ứng">
      <button class="up" data-dir="up" aria-label="Đi lên" type="button">▲</button>
      <button class="left" data-dir="left" aria-label="Đi sang trái" type="button">◀</button>
      <button class="down" data-dir="down" aria-label="Đi xuống" type="button">▼</button>
      <button class="right" data-dir="right" aria-label="Đi sang phải" type="button">▶</button>
    </div>

    <p class="hint">
      Di chuyển bằng <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> hoặc <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd>.
      Nhấn <kbd>Space</kbd> để tạm dừng. Ăn mồi đỏ để ghi điểm!
    </p>
  </main>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const overlay = document.getElementById('overlay');
      const overlayIcon = document.getElementById('overlayIcon');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayText = document.getElementById('overlayText');
      const overlayButton = document.getElementById('overlayButton');
      const pauseBtn = document.getElementById('pauseBtn');
      const restartBtn = document.getElementById('restartBtn');
      const startBtn = document.getElementById('startBtn');

      const CELLS = 24;
      const CELL = canvas.width / CELLS;
      const START_INTERVAL = 135;
      const MIN_INTERVAL = 65;
      const SPEEDUP_EVERY = 5;

      let snake, food, direction, nextDirection, score, best, timer, isPaused, isOver, hasStarted;
      let touchStart = null;

      try {
        best = Number(localStorage.getItem('snakeBestScore') || 0);
      } catch (_) {
        best = 0;
      }
      bestEl.textContent = best;

      function randomFood() {
        let point;
        do {
          point = {
            x: Math.floor(Math.random() * CELLS),
            y: Math.floor(Math.random() * CELLS)
          };
        } while (snake.some(part => part.x === point.x && part.y === point.y));
        return point;
      }

      function resetGame(startImmediately = true) {
        clearInterval(timer);
        snake = [
          { x: 11, y: 12 },
          { x: 10, y: 12 },
          { x: 9, y: 12 }
        ];
        direction = { x: 1, y: 0 };
        nextDirection = { x: 1, y: 0 };
        score = 0;
        food = randomFood();
        isPaused = false;
        isOver = false;
        hasStarted = startImmediately;
        scoreEl.textContent = score;
        overlay.hidden = true;
        pauseBtn.textContent = 'Ⅱ Tạm dừng';
        draw();
        if (startImmediately) runLoop();
        else showOverlay('🐍', 'Sẵn sàng chưa?', 'Nhấn bắt đầu để điều khiển chú rắn và ăn càng nhiều mồi càng tốt.', 'Bắt đầu', beginGame);
      }

      function beginGame() {
        if (isOver) resetGame(true);
        else {
          isPaused = false;
          hasStarted = true;
          overlay.hidden = true;
          runLoop();
        }
      }

      function currentInterval() {
        return Math.max(MIN_INTERVAL, START_INTERVAL - Math.floor(score / SPEEDUP_EVERY) * 7);
      }

      function runLoop() {
        clearInterval(timer);
        if (!isPaused && !isOver && hasStarted) timer = setInterval(step, currentInterval());
      }

      function step() {
        direction = nextDirection;
        const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

        // Đâm tường hoặc đâm vào thân mình thì kết thúc ván.
        const hitWall = head.x < 0 || head.x >= CELLS || head.y < 0 || head.y >= CELLS;
        const eating = head.x === food.x && head.y === food.y;
        const bodyToCheck = eating ? snake : snake.slice(0, -1);
        const hitSelf = bodyToCheck.some(part => part.x === head.x && part.y === head.y);

        if (hitWall || hitSelf) {
          endGame();
          return;
        }

        snake.unshift(head);
        if (eating) {
          score += 1;
          scoreEl.textContent = score;
          food = randomFood();
          if (score > best) {
            best = score;
            bestEl.textContent = best;
            try { localStorage.setItem('snakeBestScore', String(best)); } catch (_) { /* Bộ nhớ có thể bị chặn. */ }
          }
          // Tăng tốc nhẹ sau mỗi vài điểm.
          runLoop();
        } else {
          snake.pop();
        }
        draw();
      }

      function endGame() {
        clearInterval(timer);
        isOver = true;
        hasStarted = false;
        draw();
        showOverlay('💥', 'Game Over!', `Bạn đạt ${score} điểm. Thử lại để phá kỷ lục nhé!`, 'Chơi lại', () => resetGame(true));
      }

      function showOverlay(icon, title, message, buttonText, action) {
        overlayIcon.textContent = icon;
        overlayTitle.textContent = title;
        overlayText.textContent = message;
        overlayButton.textContent = buttonText;
        overlayButton.onclick = action;
        overlay.hidden = false;
      }

      function pauseGame() {
        if (isOver || !hasStarted) return;
        isPaused = !isPaused;
        if (isPaused) {
          clearInterval(timer);
          pauseBtn.textContent = '▶ Tiếp tục';
          showOverlay('⏸️', 'Đã tạm dừng', 'Nghỉ một chút rồi tiếp tục cuộc săn mồi.', 'Tiếp tục', pauseGame);
        } else {
          overlay.hidden = true;
          pauseBtn.textContent = 'Ⅱ Tạm dừng';
          runLoop();
        }
      }

      function setDirection(name) {
        const directions = {
          up: { x: 0, y: -1 },
          down: { x: 0, y: 1 },
          left: { x: -1, y: 0 },
          right: { x: 1, y: 0 }
        };
        const chosen = directions[name];
        if (!chosen) return;
        // Không cho quay đầu 180 độ để rắn không tự cắn ngay lập tức.
        if (chosen.x === -direction.x && chosen.y === -direction.y) return;
        nextDirection = chosen;
        if (!hasStarted && !isOver) beginGame();
      }

      function roundedRect(x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + width, y, x + width, y + height, r);
        ctx.arcTo(x + width, y + height, x, y + height, r);
        ctx.arcTo(x, y + height, x, y, r);
        ctx.arcTo(x, y, x + width, y, r);
        ctx.closePath();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0b1625';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Lưới nền.
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.075)';
        ctx.lineWidth = 1;
        for (let i = 1; i < CELLS; i++) {
          const p = i * CELL;
          ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, canvas.height); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(canvas.width, p); ctx.stroke();
        }

        // Mồi đỏ có quầng sáng.
        const fx = food.x * CELL + CELL / 2;
        const fy = food.y * CELL + CELL / 2;
        ctx.save();
        ctx.shadowColor = '#fb5d67';
        ctx.shadowBlur = 15;
        ctx.fillStyle = '#fb5d67';
        ctx.beginPath();
        ctx.arc(fx, fy, CELL * .32, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.fillStyle = '#ffc5c8';
        ctx.beginPath();
        ctx.arc(fx - CELL * .08, fy - CELL * .1, CELL * .09, 0, Math.PI * 2);
        ctx.fill();

        // Thân rắn: đầu sáng hơn các đốt phía sau.
        snake.forEach((part, index) => {
          const inset = 2.1;
          const x = part.x * CELL + inset;
          const y = part.y * CELL + inset;
          const size = CELL - inset * 2;
          const light = Math.max(0, 1 - index / Math.max(snake.length, 1));
          ctx.fillStyle = index === 0 ? '#a4ffb6' : `hsl(${139 - index * .18}, ${58 + light * 8}%, ${38 + light * 12}%)`;
          if (index === 0) {
            ctx.shadowColor = 'rgba(124, 242, 154, .5)';
            ctx.shadowBlur = 10;
          } else {
            ctx.shadowBlur = 0;
          }
          roundedRect(x, y, size, size, 5);
          ctx.fill();
        });
        ctx.shadowBlur = 0;

        // Mắt rắn hướng theo chiều di chuyển.
        if (snake.length) {
          const head = snake[0];
          const cx = head.x * CELL + CELL / 2;
          const cy = head.y * CELL + CELL / 2;
          let eye1, eye2;
          if (direction.x !== 0) {
            eye1 = { x: cx + direction.x * 3, y: cy - 4 };
            eye2 = { x: cx + direction.x * 3, y: cy + 4 };
          } else {
            eye1 = { x: cx - 4, y: cy + direction.y * 3 };
            eye2 = { x: cx + 4, y: cy + direction.y * 3 };
          }
          ctx.fillStyle = '#0b1625';
          [eye1, eye2].forEach(eye => {
            ctx.beginPath(); ctx.arc(eye.x, eye.y, 1.6, 0, Math.PI * 2); ctx.fill();
          });
        }
      }

      document.addEventListener('keydown', event => {
        const key = event.key.toLowerCase();
        const keyMap = {
          arrowup: 'up', w: 'up',
          arrowdown: 'down', s: 'down',
          arrowleft: 'left', a: 'left',
          arrowright: 'right', d: 'right'
        };
        if (keyMap[key]) {
          event.preventDefault();
          setDirection(keyMap[key]);
        } else if (key === ' ' || key === 'spacebar') {
          event.preventDefault();
          if (!hasStarted && !isOver) beginGame(); else pauseGame();
        } else if (key === 'enter' && isOver) {
          resetGame(true);
        }
      });

      document.querySelectorAll('[data-dir]').forEach(button => {
        button.addEventListener('click', () => setDirection(button.dataset.dir));
      });

      // Hỗ trợ vuốt trên điện thoại và máy tính bảng bằng Pointer Events.
      // Giữ con trỏ trên canvas để thao tác vuốt không bị mất khi ngón tay lệch ra ngoài.
      canvas.addEventListener('pointerdown', event => {
        if (event.pointerType === 'mouse' && event.button !== 0) return;
        touchStart = { x: event.clientX, y: event.clientY };
        try { canvas.setPointerCapture(event.pointerId); } catch (_) { /* Một số trình duyệt không hỗ trợ. */ }
      });
      canvas.addEventListener('pointerup', event => {
        if (!touchStart) return;
        const dx = event.clientX - touchStart.x;
        const dy = event.clientY - touchStart.y;
        if (Math.max(Math.abs(dx), Math.abs(dy)) > 18) {
          if (Math.abs(dx) > Math.abs(dy)) setDirection(dx > 0 ? 'right' : 'left');
          else setDirection(dy > 0 ? 'down' : 'up');
        }
        touchStart = null;
      });
      canvas.addEventListener('pointercancel', () => { touchStart = null; });

      pauseBtn.addEventListener('click', () => {
        if (!hasStarted && !isOver) beginGame();
        else pauseGame();
      });
      restartBtn.addEventListener('click', () => resetGame(true));
      startBtn.addEventListener('click', () => resetGame(true));

      // Khởi động ngay khi mở trang.
      resetGame(true);
    })();
  </script>
</body>
</html>
